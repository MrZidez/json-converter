<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HAPP Config Converter</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d1117;
            color: #f0f6fc;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: #161b22;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid #30363d;
        }
        header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #30363d;
            margin-bottom: 20px;
        }
        .logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #58a6ff;
        }
        header h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #58a6ff, #3fb950);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            margin-left: auto;
            color: #8b949e;
            font-size: 14px;
        }
        .subtitle strong {
            color: #58a6ff;
            -webkit-text-fill-color: #58a6ff;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
        .card {
            background: #0d1117;
            border-radius: 14px;
            padding: 16px;
            border: 1px solid #30363d;
            display: flex;
            flex-direction: column;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .badge {
            background: #21262d;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 400;
            color: #8b949e;
        }
        textarea {
            flex: 1;
            min-height: 350px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            color: #f0f6fc;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            padding: 12px;
            resize: vertical;
            outline: none;
            line-height: 1.6;
        }
        textarea:focus {
            border-color: #58a6ff;
        }
        textarea[readonly] {
            background: #161b22;
        }
        .toolbar {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            background: #21262d;
            color: #f0f6fc;
        }
        .btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.2);
        }
        .btn.primary {
            background: #1f6feb;
        }
        .btn.success {
            background: #238636;
        }
        .btn.danger {
            background: #da3633;
        }
        .btn.orange {
            background: #d29922;
        }
        .btn.purple {
            background: #8957e5;
        }
        .settings {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            flex-wrap: wrap;
            font-size: 13px;
            color: #8b949e;
        }
        .settings label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .settings input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #58a6ff;
            cursor: pointer;
        }
        .status-bar {
            margin-top: 10px;
            padding: 6px 12px;
            background: #0d1117;
            border-radius: 8px;
            border: 1px solid #21262d;
            font-size: 13px;
            color: #8b949e;
            min-height: 34px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .status-bar .ok {
            color: #3fb950;
        }
        .status-bar .err {
            color: #f85149;
        }
        footer {
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid #30363d;
            text-align: center;
            color: #8b949e;
            font-size: 13px;
        }
        footer strong {
            color: #58a6ff;
            -webkit-text-fill-color: #58a6ff;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.hidden {
            display: none;
        }
        .modal-content {
            background: #161b22;
            border-radius: 16px;
            padding: 24px;
            max-width: 450px;
            width: 90%;
            border: 1px solid #30363d;
            position: relative;
        }
        .modal .close {
            position: absolute;
            top: 10px;
            right: 16px;
            font-size: 24px;
            color: #8b949e;
            cursor: pointer;
        }
        .modal .close:hover {
            color: #f0f6fc;
        }
        #statsText {
            font-family: 'Consolas', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            line-height: 1.8;
            margin-top: 8px;
        }
        .debug-console {
            margin-top: 12px;
            background: #0d1117;
            border-radius: 8px;
            border: 1px solid #30363d;
            padding: 10px;
            max-height: 150px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            color: #8b949e;
            display: none;
        }
        .debug-console .err {
            color: #f85149;
        }
        .debug-console .ok {
            color: #3fb950;
        }
        .debug-console .info {
            color: #58a6ff;
        }
        .debug-console .warn {
            color: #d29922;
        }
        .debug-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-weight: 600;
            border-bottom: 1px solid #30363d;
            padding-bottom: 6px;
        }
        .debug-close {
            cursor: pointer;
        }
        .debug-close:hover {
            color: #f85149;
        }
        .example-btn {
            background: transparent;
            border: 1px dashed #30363d;
            color: #8b949e;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .example-btn:hover {
            border-color: #58a6ff;
            color: #58a6ff;
        }
    </style>
</head>
<body>

    <div class="container">

        <header>
            <img src="https://raw.githubusercontent.com/MrZidez/free-sub/main/logo.jpg" alt="VPN From Kirill" class="logo" />
            <h1>🚀 HAPP Config Converter</h1>
            <span class="subtitle">by <strong>VPN From Kirill</strong></span>
        </header>

        <div class="grid">

            <!-- ВВОД -->
            <div class="card">
                <div class="card-header">
                    <span>📝 Ввод</span>
                    <span class="badge" id="linkCount">0 ссылок</span>
                </div>
                <textarea id="inputArea" placeholder="Вставьте VLESS, Hysteria2, Trojan, VMESS ссылки..."></textarea>
                <div class="toolbar">
                    <button class="btn primary" onclick="doPaste()">📋 Вставить</button>
                    <button class="btn success" onclick="doConvert()">🔄 Конвертировать</button>
                    <button class="btn danger" onclick="doClearInput()">🗑️ Очистить</button>
                    <button class="btn orange" onclick="toggleDebug()">🐛 Отладка</button>
                    <button class="example-btn" onclick="loadExample()">📄 Пример</button>
                </div>
                <div class="settings">
                    <label><input type="checkbox" id="autoConvert" checked /> Автоконвертация</label>
                    <label><input type="checkbox" id="prettyJson" checked /> Форматировать JSON</label>
                </div>
                <div class="status-bar" id="inputStatus">💡 Вставьте ссылки и нажмите Конвертировать</div>
            </div>

            <!-- ВЫВОД -->
            <div class="card">
                <div class="card-header">
                    <span>📤 Вывод (JSON)</span>
                    <span class="badge" id="statsLabel">Ожидание...</span>
                </div>
                <textarea id="outputArea" readonly placeholder="Здесь будет JSON..."></textarea>
                <div class="toolbar">
                    <button class="btn success" onclick="doCopy()">📋 Копировать</button>
                    <button class="btn orange" onclick="doSave()">💾 Сохранить</button>
                    <button class="btn purple" onclick="doStats()">📊 Статистика</button>
                    <button class="btn danger" onclick="doClearOutput()">🗑️ Очистить</button>
                </div>
                <div class="status-bar">
                    <span>📏 <span id="outputSize">0</span> символов</span>
                    <span id="serverCount">🌐 0 серверов</span>
                </div>
            </div>

        </div>

        <!-- ОТЛАДКА -->
        <div class="debug-console" id="debugConsole">
            <div class="debug-header"><span>🐛 Отладка</span><span class="debug-close" onclick="toggleDebug()">✕</span></div>
            <div id="debugLog"></div>
        </div>

        <!-- СТАТИСТИКА -->
        <div id="statsModal" class="modal hidden">
            <div class="modal-content">
                <span class="close" onclick="closeStats()">&times;</span>
                <pre id="statsText"></pre>
            </div>
        </div>

        <footer>© 2026 <strong>VPN From Kirill</strong> — для HAPP</footer>

    </div>

    <script>
        // ======================================================================
        //  ВСЕ ФУНКЦИИ В ГЛОБАЛЬНОЙ ОБЛАСТИ
        // ======================================================================

        // ---- ОТЛАДКА ----
        var debugVisible = false;
        var debugLog = document.getElementById('debugLog');

        function log(msg, type) {
            type = type || 'info';
            var cls = { error: 'err', success: 'ok', info: 'info', warning: 'warn' } [type] || 'info';
            var time = new Date().toLocaleTimeString();
            debugLog.innerHTML += '<div><span class="' + cls + '">[' + time + '] ' + msg + '</span></div>';
            debugLog.scrollTop = debugLog.scrollHeight;
            console.log('[' + type + '] ' + msg);
        }

        function toggleDebug() {
            var el = document.getElementById('debugConsole');
            debugVisible = !debugVisible;
            el.style.display = debugVisible ? 'block' : 'none';
            if (debugVisible) log('🐛 Отладка включена', 'info');
        }

        // ---- DOM ----
        var inputArea = document.getElementById('inputArea');
        var outputArea = document.getElementById('outputArea');
        var linkCount = document.getElementById('linkCount');
        var statsLabel = document.getElementById('statsLabel');
        var outputSize = document.getElementById('outputSize');
        var serverCount = document.getElementById('serverCount');
        var inputStatus = document.getElementById('inputStatus');
        var autoConvert = document.getElementById('autoConvert');
        var prettyJson = document.getElementById('prettyJson');

        var convertedData = null;

        // ---- ПРИМЕР ----
        function loadExample() {
            var example = '🇸🇴 Авто выбор локации 🚀\n' +
                'vless://62611b77-c747-4e39-9cc2-643805a56ccd@194.93.61.107:443?flow=xtls-rprx-vision&encryption=none&security=reality&sni=cdnjs.com&fp=firefox&pbk=0AVsyS7udTbxKRdSyQ2rtFC63icDQOVWq8FvAhhU-WY&sid=cbb0a5c1dc905505&type=tcp&headerType=none#nl\n' +
                'vless://75bb93eb-2ad1-4172-a65d-b53121b8f9d7@64.188.82.123:443?encryption=none&security=reality&sni=worklist.medic-ml.ru&fp=firefox&pbk=660bDah5b-PtCfAbQ3g2tJySO41zsfaXCPb7L3nQCQc&sid=e1ac2faf5e5f309e&type=xhttp&mode=auto&path=%2Fapi%2Fv2%2Ftelemetry#Estonia\n' +
                '\n' +
                '🇸🇪 Швеция\n' +
                'vless://627c984a-1668-0029-9c65-768b636f727f@95.143.188.10:443?type=xhttp&path=/repository&extra={"xmux":{"cMaxReuseTimes":0,"hKeepAlivePeriod":0,"hMaxRequestTimes":"600-900","hMaxReusableSecs":"1800-3000","maxConnections":2}}&security=reality&sni=git.medrocket.ru&pbk=YHPoUNxsml4z6pYt-7djOb1lqnBjxCk4-2mk84pveyc&sid=3b5b38669a1a51c0#proxy1';
            inputArea.value = example;
            updateLinkCount();
            if (autoConvert.checked) doConvert();
        }

        // ---- СЧЕТЧИК ----
        function updateLinkCount() {
            var text = inputArea.value;
            var lines = text.split('\n').filter(function(l) { return l.trim(); });
            var links = lines.filter(function(l) { return /^(vless:\/\/|hysteria2:\/\/|trojan:\/\/|vmess:\/\/|ss:\/\/)/.test(l
                    .trim()); });
            linkCount.textContent = lines.length + ' строк, ' + links.length + ' ссылок';
        }

        // ---- КНОПКИ ----
        function doPaste() {
            navigator.clipboard.readText().then(function(text) {
                inputArea.value = text;
                updateLinkCount();
                if (autoConvert.checked) doConvert();
            }).catch(function() { alert('Не удалось вставить из буфера'); });
        }

        function doClearInput() {
            inputArea.value = '';
            updateLinkCount();
            inputStatus.innerHTML = '💡 Ввод очищен';
        }

        function doClearOutput() {
            outputArea.value = '';
            statsLabel.textContent = 'Ожидание...';
            outputSize.textContent = '0';
            serverCount.textContent = '🌐 0 серверов';
            convertedData = null;
        }

        function doCopy() {
            var text = outputArea.value;
            if (!text) return alert('Нет данных');
            navigator.clipboard.writeText(text).then(function() {
                var btn = document.querySelector('.btn.success');
                var orig = btn.textContent;
                btn.textContent = '✅ Готово!';
                setTimeout(function() { btn.textContent = orig; }, 1200);
            });
        }

        function doSave() {
            var text = outputArea.value;
            if (!text) return alert('Нет данных');
            var blob = new Blob([text], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'happ_' + new Date().toISOString().slice(0, 10) + '.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function doStats() {
            if (!convertedData) return alert('Сначала сконвертируйте данные');
            var modal = document.getElementById('statsModal');
            var text = document.getElementById('statsText');
            var groups = convertedData.length;
            var servers = 0;
            var protocols = {};
            for (var i = 0; i < convertedData.length; i++) {
                var g = convertedData[i];
                for (var j = 0; j < (g.outbounds || []).length; j++) {
                    var ob = g.outbounds[j];
                    if (ob.tag && ob.tag !== 'direct' && ob.tag !== 'block') {
                        servers++;
                        var proto = ob.protocol || 'unknown';
                        protocols[proto] = (protocols[proto] || 0) + 1;
                    }
                }
            }
            var protoStr = '';
            for (var p in protocols) {
                protoStr += '   • ' + p + ': ' + protocols[p] + '\n';
            }
            if (!protoStr) protoStr = '   • нет';
            text.textContent = '📊 СТАТИСТИКА\n\n📁 Групп: ' + groups + '\n🌐 Серверов: ' + servers +
                '\n\n📝 Протоколы:\n' + protoStr;
            modal.classList.remove('hidden');
        }

        function closeStats() {
            document.getElementById('statsModal').classList.add('hidden');
        }

        // ---- АВТОКОНВЕРТАЦИЯ ----
        inputArea.addEventListener('input', function() {
            updateLinkCount();
            if (autoConvert.checked) doConvert();
        });

        inputArea.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                e.preventDefault();
                doConvert();
            }
        });

        // ---- ОСНОВНАЯ КОНВЕРТАЦИЯ ----
        function doConvert() {
            var text = inputArea.value.trim();
            log('Конвертация: ' + text.length + ' символов', 'info');

            if (!text) {
                outputArea.value = '';
                statsLabel.textContent = 'Нет данных';
                outputSize.textContent = '0';
                serverCount.textContent = '🌐 0 серверов';
                convertedData = null;
                inputStatus.innerHTML = '⚠️ Нет данных';
                return;
            }

            var lines = text.split('\n');
            log('Всего строк: ' + lines.length, 'info');

            var groups = [];
            var currentGroup = null;
            var currentServers = [];

            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                if (!line) continue;

                // Проверяем группу (флаг + текст) — БЕЗ РЕГУЛЯРКИ С РАНЖЕМ
                var isGroup = false;
                var firstChar = line.charAt(0);
                // Проверяем, что первый символ — эмодзи флага (диапазон Unicode)
                var flagCode = firstChar.charCodeAt(0);
                if (flagCode >= 127462 && flagCode <= 127487) { // 🇦-🇿
                    isGroup = true;
                }

                // Дополнительная проверка: строка начинается с флага и не является ссылкой
                if (isGroup && !line.startsWith('vless://') && !line.startsWith('hysteria2://') &&
                    !line.startsWith('trojan://') && !line.startsWith('vmess://') && !line.startsWith('ss://') &&
                    !line.startsWith('{')) {
                    isGroup = true;
                } else {
                    isGroup = false;
                }

                var isVless = line.startsWith('vless://');
                var isHysteria = line.startsWith('hysteria2://');
                var isTrojan = line.startsWith('trojan://');
                var isVmess = line.startsWith('vmess://');
                var isSs = line.startsWith('ss://');
                var isJson = line.startsWith('{');

                if (isGroup) {
                    log('Найдена группа: "' + line + '"', 'info');
                    if (currentGroup && currentServers.length > 0) {
                        groups.push({ name: currentGroup, servers: currentServers });
                        log('Добавлена группа "' + currentGroup + '" с ' + currentServers.length + ' серверами', 'ok');
                    }
                    currentGroup = line;
                    currentServers = [];
                } else if (isVless) {
                    currentServers.push({ type: 'vless', data: line });
                    log('Найден VLESS сервер', 'info');
                } else if (isHysteria) {
                    currentServers.push({ type: 'hysteria2', data: line });
                    log('Найден Hysteria2 сервер', 'info');
                } else if (isTrojan) {
                    currentServers.push({ type: 'trojan', data: line });
                    log('Найден Trojan сервер', 'info');
                } else if (isVmess) {
                    currentServers.push({ type: 'vmess', data: line });
                    log('Найден VMESS сервер', 'info');
                } else if (isSs) {
                    currentServers.push({ type: 'ss', data: line });
                    log('Найден Shadowsocks сервер', 'info');
                } else if (isJson) {
                    try {
                        var parsed = JSON.parse(line);
                        currentServers.push({ type: 'json', data: parsed });
                        log('Найден JSON конфиг', 'info');
                    } catch (e) {
                        log('Ошибка парсинга JSON: ' + e.message, 'error');
                    }
                } else if (!currentGroup && (isVless || isHysteria || isTrojan || isVmess || isSs)) {
                    currentGroup = 'Без названия';
                    var type = line.split(':')[0];
                    currentServers.push({ type: type, data: line });
                    log('Создана группа "Без названия"', 'warning');
                }
            }

            if (currentGroup && currentServers.length > 0) {
                groups.push({ name: currentGroup, servers: currentServers });
                log('Добавлена последняя группа "' + currentGroup + '" с ' + currentServers.length + ' серверами', 'ok');
            }

            log('Всего групп: ' + groups.length, 'info');

            if (groups.length === 0) {
                outputArea.value = '';
                statsLabel.textContent = 'Нет групп';
                outputSize.textContent = '0';
                serverCount.textContent = '🌐 0 серверов';
                convertedData = null;
                inputStatus.innerHTML = '<span style="color:#f85149;">❌ Группы не найдены!</span>';
                log('Группы не найдены!', 'error');
                return;
            }

            // КОНВЕРТАЦИЯ
            var result = [];
            var proxyCounter = 1;

            for (var gi = 0; gi < groups.length; gi++) {
                var g = groups[gi];
                var outbounds = [];
                var usedTags = {};

                for (var ei = 0; ei < g.servers.length; ei++) {
                    var entry = g.servers[ei];
                    var ob = null;
                    try {
                        if (entry.type === 'vless') ob = parseVless(entry.data);
                        else if (entry.type === 'hysteria2') ob = parseHysteria2(entry.data);
                        else if (entry.type === 'trojan') ob = parseTrojan(entry.data);
                        else if (entry.type === 'vmess') ob = parseVmess(entry.data);
                        else if (entry.type === 'ss') ob = parseShadowsocks(entry.data);
                        else if (entry.type === 'json') ob = entry.data;
                    } catch (e) {
                        log('Ошибка парсинга: ' + e.message, 'error');
                    }

                    if (ob) {
                        var tag = ob.tag || 'proxy';
                        if (tag === 'proxy' || usedTags[tag]) {
                            tag = 'proxy-' + proxyCounter;
                            proxyCounter++;
                        }
                        ob.tag = tag;
                        usedTags[tag] = true;
                        outbounds.push(ob);
                        log('Добавлен сервер: ' + tag, 'ok');
                    } else {
                        var shortData = entry.data ? entry.data.substring(0, 40) : '';
                        log('Не удалось распарсить: ' + shortData + '...', 'warning');
                    }
                }

                if (outbounds.length === 0) {
                    log('Группа "' + g.name + '" пропущена (нет серверов)', 'warning');
                    continue;
                }

                outbounds.push({ tag: 'direct', protocol: 'freedom' });
                outbounds.push({ tag: 'block', protocol: 'blackhole' });

                result.push({
                    remarks: g.name,
                    dns: { servers: ['1.1.1.1', '1.0.0.1'], queryStrategy: 'UseIP' },
                    routing: {
                        rules: [{ type: 'field', protocol: ['bittorrent'], outboundTag: 'direct' }],
                        domainMatcher: 'hybrid',
                        domainStrategy: 'IPIfNonMatch'
                    },
                    inbounds: [{
                        tag: 'socks',
                        port: 10808,
                        listen: '127.0.0.1',
                        protocol: 'socks',
                        settings: { udp: true, auth: 'noauth' },
                        sniffing: { enabled: true, routeOnly: false, destOverride: ['http', 'tls', 'quic'] }
                    }, {
                        tag: 'http',
                        port: 10809,
                        listen: '127.0.0.1',
                        protocol: 'http',
                        settings: { allowTransparent: false },
                        sniffing: { enabled: true, routeOnly: false, destOverride: ['http', 'tls', 'quic'] }
                    }],
                    outbounds: outbounds
                });
            }

            var json = prettyJson.checked ? JSON.stringify(result, null, 2) : JSON.stringify(result);
            outputArea.value = json;
            convertedData = result;
            outputSize.textContent = json.length;

            var total = 0;
            for (var ri = 0; ri < result.length; ri++) {

                for (var oi = 0; oi < obList.length; oi++) {

                ' серверов</span>';

        }

        function parseVless(url) {
            url = url.replace('vless://', '');
            var tag = '';
            if (url.indexOf('#') !== -1) {
                var parts = url.split('#');
                url = parts[0];
                tag = decodeURIComponent(parts[1] || '').trim();
            }
            if (!tag) tag = 'proxy';
            if (url.indexOf('@') === -1) return null;
            var split1 = url.split('@');
            var uid = split1[0];
            var rest = split1[1];
            var addrPort = rest;
            var params = '';
            if (rest.indexOf('?') !== -1) {
                var parts2 = rest.split('?');
                addrPort = parts2[0];
                params = parts2[1] || '';
            }
            if (addrPort.indexOf(':') === -1) return null;
            var addrParts = addrPort.split(':');
            var address = addrParts[0];
            var port = addrParts[1];
            var param = {};
            if (params) {
                var paramParts = params.split('&');
                for (var i = 0; i < paramParts.length; i++) {
                    var p = paramParts[i];
                    if (p.indexOf('=') !== -1) {
                        var kv = p.split('=');
                        var k = kv[0];
                        var v = kv[1];
                        if (k === 'path' || k === 'host') {
                            v = decodeURIComponent(v);
                        }
                        param[k] = v;
                    }
                }
            }
            var network = param.type || 'tcp';
            var security = param.security || 'none';
            var outbound = {
                tag: tag,
                protocol: 'vless',
                settings: {
                    vnext: [{
                        address: address,
                        port: parseInt(port),
                        users: [{ id: uid, encryption: param.encryption || 'none', flow: param.flow || '',
                            level: 0 }]
                    }]
                }
            };
            var stream = { network: network, security: security };
            if (network === 'ws') {
                var ws = {};
                if (param.path) ws.path = param.path;
                if (param.host) ws.headers = { Host: param.host };
                else if (param.sni) ws.headers = { Host: param.sni };
                stream.wsSettings = ws;
            }
            if (security === 'tls') {
                var tls = {};
                if (param.sni) tls.serverName = param.sni;
                else if (param.host) tls.serverName = param.host;
                tls.fingerprint = param.fp || 'chrome';
                stream.tlsSettings = tls;
            } else if (security === 'reality') {
                var reality = {};
                if (param.sni) reality.serverName = param.sni;
                if (param.fp) reality.fingerprint = param.fp;
                if (param.pbk) reality.publicKey = param.pbk;
                if (param.sid) reality.shortId = param.sid;
                stream.realitySettings = reality;
            }
            if (network === 'xhttp') {
                var xhttp = {};
                if (param.path) xhttp.path = param.path;
                if (param.mode) xhttp.mode = param.mode;
                if (param.host) xhttp.host = param.host;
                if (param.extra) { try { xhttp.extra = JSON.parse(param.extra); } catch (e) {} }
                stream.xhttpSettings = xhttp;
            } else if (network === 'grpc') {
                var grpc = {};
                if (param.serviceName) grpc.serviceName = param.serviceName;
                if (param.mode === 'gun') grpc.multiMode = true;
                stream.grpcSettings = grpc;
            }
            var streamKeys = Object.keys(stream);
            if (streamKeys.length > 1) outbound.streamSettings = stream;
            return outbound;
        }

                        var v = kv[1];
                        if (k === 'sni') v = decodeURIComponent(v);
                        param[k] = v;
                    }
                }
            }
            var outbound = {
                tag: tag,
                protocol: 'hysteria',
                settings: { address: address, port: parseInt(port), version: 2 },

                }
            };
            var tls = {};
            if (param.sni) tls.serverName = param.sni;
            if (param.fp) tls.fingerprint = param.fp;
            if (Object.keys(tls).length) outbound.streamSettings.tlsSettings = tls;
            return outbound;
        }

        function parseTrojan(url) {
            url = url.replace('trojan://', '');

            if (rest.indexOf('?') !== -1) {
                var parts2 = rest.split('?');

            if (addrPort.indexOf(':') === -1) return null;
            var addrParts = addrPort.split(':');

            var outbound = {

            var stream = { network: network, security: security };
            if (security === 'tls') {

            if (Object.keys(stream).length > 1) outbound.streamSettings = stream;

        }

        function parseVmess(url) {
            url = url.replace('vmess://', '');
            try {
                var decoded = atob(url);
                var config = JSON.parse(decoded);
                var uid = config.id || '';
                if (uid.length > 36) uid = uid.slice(0, 36);
                var tag = config.ps || 'proxy';
                try { tag = decodeURIComponent(tag); } catch (e) {}
                var outbound = {
                    tag: tag,
                    protocol: 'vmess',
                    settings: {
                        vnext: [{
                            address: config.add || '',
                            port: parseInt(config.port || 0),
                            users: [{ id: uid, alterId: parseInt(config.aid || 0), security: config.scy ||
                                    'auto' }]
                        }]
                    },
                    streamSettings: { network: config.net || 'tcp', security: config.tls || 'none' }
                };
                if ((config.net || '') === 'ws') {
                    var ws = {};
                    if (config.path) ws.path = config.path;
                    if (config.host) ws.headers = { Host: config.host };
                    outbound.streamSettings.wsSettings = ws;
                }
                if ((config.tls || '') === 'tls') {
                    var tls = {};
                    if (config.sni) tls.serverName = config.sni;
                    if (config.fp) tls.fingerprint = config.fp;
                    outbound.streamSettings.tlsSettings = tls;
                }
                return outbound;
            } catch (e) { return null; }
        }

        function parseShadowsocks(url) {
            url = url.replace('ss://', '');
            var tag = '';
            if (url.indexOf('#') !== -1) {
                var parts = url.split('#');
                url = parts[0];
                tag = decodeURIComponent(parts[1] || '').trim();
            }
            if (!tag) tag = 'proxy';
            if (url.indexOf('@') !== -1) {
                var split1 = url.split('@');
                var methodPassword = split1[0];
                var rest = split1[1];
                var method = 'aes-256-gcm';
                var password = methodPassword;
                if (methodPassword.indexOf(':') !== -1) {
                    var mpParts = methodPassword.split(':');
                    method = mpParts[0];
                    password = mpParts[1] || '';
                }
                var addrPort = rest;
                if (rest.indexOf('?') !== -1) addrPort = rest.split('?')[0];
                if (addrPort.indexOf(':') === -1) return null;
                var addrParts = addrPort.split(':');
                var address = addrParts[0];
                var port = addrParts[1];
                return {
                    tag: tag,
                    protocol: 'shadowsocks',
                    settings: { servers: [{ address: address, port: parseInt(port), method: method,
                            password: password }] }
                };
            }
            return null;
        }
