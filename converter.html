<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HAPP Config Converter</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d1117;
            color: #f0f6fc;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: #161b22;
            border-radius: 20px;
            padding: 24px;
            border: 1px solid #30363d;
        }
        header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #30363d;
            margin-bottom: 20px;
        }
        .logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #58a6ff;
        }
        header h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #58a6ff, #3fb950);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            margin-left: auto;
            color: #8b949e;
            font-size: 14px;
        }
        .subtitle strong {
            color: #58a6ff;
            -webkit-text-fill-color: #58a6ff;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
        .card {
            background: #0d1117;
            border-radius: 14px;
            padding: 16px;
            border: 1px solid #30363d;
            display: flex;
            flex-direction: column;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .badge {
            background: #21262d;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 400;
            color: #8b949e;
        }
        textarea {
            flex: 1;
            min-height: 350px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            color: #f0f6fc;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            padding: 12px;
            resize: vertical;
            outline: none;
            line-height: 1.6;
        }
        textarea:focus {
            border-color: #58a6ff;
        }
        textarea[readonly] {
            background: #161b22;
        }
        .toolbar {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            background: #21262d;
            color: #f0f6fc;
        }
        .btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.2);
        }
        .btn.primary {
            background: #1f6feb;
        }
        .btn.success {
            background: #238636;
        }
        .btn.danger {
            background: #da3633;
        }
        .btn.orange {
            background: #d29922;
        }
        .btn.purple {
            background: #8957e5;
        }
        .settings {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            flex-wrap: wrap;
            font-size: 13px;
            color: #8b949e;
        }
        .settings label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .settings input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #58a6ff;
            cursor: pointer;
        }
        .status-bar {
            margin-top: 10px;
            padding: 6px 12px;
            background: #0d1117;
            border-radius: 8px;
            border: 1px solid #21262d;
            font-size: 13px;
            color: #8b949e;
            min-height: 34px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .status-bar .ok {
            color: #3fb950;
        }
        .status-bar .err {
            color: #f85149;
        }
        footer {
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid #30363d;
            text-align: center;
            color: #8b949e;
            font-size: 13px;
        }
        footer strong {
            color: #58a6ff;
            -webkit-text-fill-color: #58a6ff;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.hidden {
            display: none;
        }
        .modal-content {
            background: #161b22;
            border-radius: 16px;
            padding: 24px;
            max-width: 450px;
            width: 90%;
            border: 1px solid #30363d;
            position: relative;
        }
        .modal .close {
            position: absolute;
            top: 10px;
            right: 16px;
            font-size: 24px;
            color: #8b949e;
            cursor: pointer;
        }
        .modal .close:hover {
            color: #f0f6fc;
        }
        #statsText {
            font-family: 'Consolas', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            line-height: 1.8;
            margin-top: 8px;
        }
        .debug-console {
            margin-top: 12px;
            background: #0d1117;
            border-radius: 8px;
            border: 1px solid #30363d;
            padding: 10px;
            max-height: 150px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            color: #8b949e;
            display: none;
        }
        .debug-console .err {
            color: #f85149;
        }
        .debug-console .ok {
            color: #3fb950;
        }
        .debug-console .info {
            color: #58a6ff;
        }
        .debug-console .warn {
            color: #d29922;
        }
        .debug-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-weight: 600;
            border-bottom: 1px solid #30363d;
            padding-bottom: 6px;
        }
        .debug-close {
            cursor: pointer;
        }
        .debug-close:hover {
            color: #f85149;
        }
        .example-btn {
            background: transparent;
            border: 1px dashed #30363d;
            color: #8b949e;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .example-btn:hover {
            border-color: #58a6ff;
            color: #58a6ff;
        }
    </style>
</head>
<body>

    <div class="container">

        <header>
            <img src="https://raw.githubusercontent.com/MrZidez/free-sub/main/logo.jpg" alt="VPN From Kirill" class="logo" />
            <h1>🚀 HAPP Config Converter</h1>
            <span class="subtitle">by <strong>VPN From Kirill</strong></span>
        </header>

        <div class="grid">

            <!-- ВВОД -->
            <div class="card">
                <div class="card-header">
                    <span>📝 Ввод</span>
                    <span class="badge" id="linkCount">0 ссылок</span>
                </div>
                <textarea id="inputArea" placeholder="Вставьте VLESS, Hysteria2, Trojan, VMESS ссылки..."></textarea>
                <div class="toolbar">
                    <button class="btn primary" onclick="window.doPaste()">📋 Вставить</button>
                    <button class="btn success" onclick="window.doConvert()">🔄 Конвертировать</button>
                    <button class="btn danger" onclick="window.doClearInput()">🗑️ Очистить</button>
                    <button class="btn orange" onclick="window.toggleDebug()">🐛 Отладка</button>
                    <button class="example-btn" onclick="window.loadExample()">📄 Пример</button>
                </div>
                <div class="settings">
                    <label><input type="checkbox" id="autoConvert" checked /> Автоконвертация</label>
                    <label><input type="checkbox" id="prettyJson" checked /> Форматировать JSON</label>
                </div>
                <div class="status-bar" id="inputStatus">💡 Вставьте ссылки и нажмите Конвертировать</div>
            </div>

            <!-- ВЫВОД -->
            <div class="card">
                <div class="card-header">
                    <span>📤 Вывод (JSON)</span>
                    <span class="badge" id="statsLabel">Ожидание...</span>
                </div>
                <textarea id="outputArea" readonly placeholder="Здесь будет JSON..."></textarea>
                <div class="toolbar">
                    <button class="btn success" onclick="window.doCopy()">📋 Копировать</button>
                    <button class="btn orange" onclick="window.doSave()">💾 Сохранить</button>
                    <button class="btn purple" onclick="window.doStats()">📊 Статистика</button>
                    <button class="btn danger" onclick="window.doClearOutput()">🗑️ Очистить</button>
                </div>
                <div class="status-bar">
                    <span>📏 <span id="outputSize">0</span> символов</span>
                    <span id="serverCount">🌐 0 серверов</span>
                </div>
            </div>

        </div>

        <!-- ОТЛАДКА -->
        <div class="debug-console" id="debugConsole">
            <div class="debug-header"><span>🐛 Отладка</span><span class="debug-close" onclick="window.toggleDebug()">✕</span></div>
            <div id="debugLog"></div>
        </div>

        <!-- СТАТИСТИКА -->
        <div id="statsModal" class="modal hidden">
            <div class="modal-content">
                <span class="close" onclick="window.closeStats()">&times;</span>
                <pre id="statsText"></pre>
            </div>
        </div>

        <footer>© 2026 <strong>VPN From Kirill</strong> — для HAPP</footer>

    </div>

    <script>
        // ======================================================================
        //  ВСЕ ФУНКЦИИ В ГЛОБАЛЬНОЙ ОБЛАСТИ
        // ======================================================================

        // ---- ОТЛАДКА ----
        let debugVisible = false;
        const debugLog = document.getElementById('debugLog');

        function log(msg, type) {
            type = type || 'info';
            const cls = { error: 'err', success: 'ok', info: 'info', warning: 'warn' } [type] || 'info';
            const time = new Date().toLocaleTimeString();
            debugLog.innerHTML += `<div><span class="${cls}">[${time}] ${msg}</span></div>`;
            debugLog.scrollTop = debugLog.scrollHeight;
            console.log(`[${type}] ${msg}`);
        }

        window.toggleDebug = function() {
            const el = document.getElementById('debugConsole');
            debugVisible = !debugVisible;
            el.style.display = debugVisible ? 'block' : 'none';
            if (debugVisible) log('🐛 Отладка включена', 'info');
        };

        // ---- DOM ----
        const inputArea = document.getElementById('inputArea');
        const outputArea = document.getElementById('outputArea');
        const linkCount = document.getElementById('linkCount');
        const statsLabel = document.getElementById('statsLabel');
        const outputSize = document.getElementById('outputSize');
        const serverCount = document.getElementById('serverCount');
        const inputStatus = document.getElementById('inputStatus');
        const autoConvert = document.getElementById('autoConvert');
        const prettyJson = document.getElementById('prettyJson');

        let convertedData = null;

        // ---- ПРИМЕР ----
        window.loadExample = function() {
            const example = `🇸🇴 Авто выбор локации 🚀
        vless://...
        vless://...
        
        🇸🇪 Швеция
        vless://...`;
            inputArea.value = example;
            updateLinkCount();
            if (autoConvert.checked) window.doConvert();
        };

        // ---- СЧЕТЧИК ----
        function updateLinkCount() {
            const text = inputArea.value;
            const lines = text.split('\n').filter(l => l.trim());
            const links = lines.filter(l => /^(vless:\/\/|hysteria2:\/\/|trojan:\/\/|vmess:\/\/|ss:\/\/)/.test(l.trim()));
            linkCount.textContent = `${lines.length} строк, ${links.length} ссылок`;
        }

        // ---- КНОПКИ ----
        window.doPaste = function() {
            navigator.clipboard.readText().then(text => {
                inputArea.value = text;
                updateLinkCount();
                if (autoConvert.checked) window.doConvert();
            }).catch(() => alert('Не удалось вставить из буфера'));
        };

        window.doClearInput = function() {
            inputArea.value = '';
            updateLinkCount();
            inputStatus.innerHTML = '💡 Ввод очищен';
        };

        window.doClearOutput = function() {
            outputArea.value = '';
            statsLabel.textContent = 'Ожидание...';
            outputSize.textContent = '0';
            serverCount.textContent = '🌐 0 серверов';
            convertedData = null;
        };

        window.doCopy = function() {
            const text = outputArea.value;
            if (!text) return alert('Нет данных');
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.btn.success');
                const orig = btn.textContent;
                btn.textContent = '✅ Готово!';
                setTimeout(() => btn.textContent = orig, 1200);
            });
        };

        window.doSave = function() {
            const text = outputArea.value;
            if (!text) return alert('Нет данных');
            const blob = new Blob([text], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `happ_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        };

        window.doStats = function() {
            if (!convertedData) return alert('Сначала сконвертируйте данные');
            const modal = document.getElementById('statsModal');
            const text = document.getElementById('statsText');
            let groups = convertedData.length;
            let servers = 0;
            let protocols = {};
            for (const g of convertedData) {
                for (const ob of g.outbounds || []) {
                    if (ob.tag && !['direct', 'block'].includes(ob.tag)) {
                        servers++;
                        protocols[ob.protocol] = (protocols[ob.protocol] || 0) + 1;
                    }
                }
            }
            let protoStr = Object.entries(protocols).map(([k, v]) => `   • ${k}: ${v}`).join('\n') || '   • нет';
            text.textContent =
                `📊 СТАТИСТИКА\n\n📁 Групп: ${groups}\n🌐 Серверов: ${servers}\n\n📝 Протоколы:\n${protoStr}`;
            modal.classList.remove('hidden');
        };

        window.closeStats = function() {
            document.getElementById('statsModal').classList.add('hidden');
        };

        // ---- АВТОКОНВЕРТАЦИЯ ----
        inputArea.addEventListener('input', function() {
            updateLinkCount();
            if (autoConvert.checked) window.doConvert();
        });

        inputArea.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') { e.preventDefault();
                window.doConvert(); }
        });

        // ---- ОСНОВНАЯ КОНВЕРТАЦИЯ ----
        window.doConvert = function() {
            const text = inputArea.value.trim();
            log(`Конвертация: ${text.length} символов`, 'info');

            if (!text) {
                outputArea.value = '';
                statsLabel.textContent = 'Нет данных';
                outputSize.textContent = '0';
                serverCount.textContent = '🌐 0 серверов';
                convertedData = null;
                inputStatus.innerHTML = '⚠️ Нет данных';
                return;
            }

            const lines = text.split('\n');
            log(`Всего строк: ${lines.length}`, 'info');

            const groups = [];
            let currentGroup = null;
            let currentServers = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                // Проверяем группу (флаг + текст)
                const isGroup = /^[🇦-🇿]/.test(line) && !line.startsWith('vless://') && !line.startsWith('hysteria2://') &&
                    !line.startsWith('trojan://') && !line.startsWith('vmess://') && !line.startsWith('ss://') && !line
                    .startsWith('{');

                const isVless = line.startsWith('vless://');
                const isHysteria = line.startsWith('hysteria2://');
                const isTrojan = line.startsWith('trojan://');
                const isVmess = line.startsWith('vmess://');
                const isSs = line.startsWith('ss://');
                const isJson = line.startsWith('{');

                if (isGroup) {
                    log(`Найдена группа: "${line}"`, 'info');
                    if (currentGroup && currentServers.length > 0) {
                        groups.push({ name: currentGroup, servers: currentServers });
                        log(`Добавлена группа "${currentGroup}" с ${currentServers.length} серверами`, 'ok');
                    }
                    currentGroup = line;
                    currentServers = [];
                } else if (isVless) {
                    currentServers.push({ type: 'vless', data: line });
                    log(`Найден VLESS сервер`, 'info');
                } else if (isHysteria) {
                    currentServers.push({ type: 'hysteria2', data: line });
                    log(`Найден Hysteria2 сервер`, 'info');
                } else if (isTrojan) {
                    currentServers.push({ type: 'trojan', data: line });
                    log(`Найден Trojan сервер`, 'info');
                } else if (isVmess) {
                    currentServers.push({ type: 'vmess', data: line });
                    log(`Найден VMESS сервер`, 'info');
                } else if (isSs) {
                    currentServers.push({ type: 'ss', data: line });
                    log(`Найден Shadowsocks сервер`, 'info');
                } else if (isJson) {
                    try {
                        const parsed = JSON.parse(line);
                        currentServers.push({ type: 'json', data: parsed });
                        log(`Найден JSON конфиг`, 'info');
                    } catch (e) {
                        log(`Ошибка парсинга JSON: ${e.message}`, 'error');
                    }
                } else if (!currentGroup && (isVless || isHysteria || isTrojan || isVmess || isSs)) {
                    currentGroup = 'Без названия';
                    const type = line.split(':')[0];
                    currentServers.push({ type: type, data: line });
                    log(`Создана группа "Без названия"`, 'warning');
                }
            }

            if (currentGroup && currentServers.length > 0) {
                groups.push({ name: currentGroup, servers: currentServers });
                log(`Добавлена последняя группа "${currentGroup}" с ${currentServers.length} серверами`, 'ok');
            }

            log(`Всего групп: ${groups.length}`, 'info');

            if (groups.length === 0) {
                outputArea.value = '';
                statsLabel.textContent = 'Нет групп';
                outputSize.textContent = '0';
                serverCount.textContent = '🌐 0 серверов';
                convertedData = null;
                inputStatus.innerHTML = '<span style="color:#f85149;">❌ Группы не найдены!</span>';
                log('Группы не найдены!', 'error');
                return;
            }

            // КОНВЕРТАЦИЯ
            const result = [];
            let proxyCounter = 1;

            for (const g of groups) {
                const outbounds = [];
                const usedTags = new Set();

                for (const entry of g.servers) {
                    let ob = null;
                    try {
                        if (entry.type === 'vless') ob = parseVless(entry.data);
                        else if (entry.type === 'hysteria2') ob = parseHysteria2(entry.data);
                        else if (entry.type === 'trojan') ob = parseTrojan(entry.data);
                        else if (entry.type === 'vmess') ob = parseVmess(entry.data);
                        else if (entry.type === 'ss') ob = parseShadowsocks(entry.data);
                        else if (entry.type === 'json') ob = entry.data;
                    } catch (e) {
                        log(`Ошибка парсинга: ${e.message}`, 'error');
                    }

                    if (ob) {
                        let tag = ob.tag || 'proxy';
                        if (tag === 'proxy' || usedTags.has(tag)) {
                            tag = `proxy-${proxyCounter}`;
                            proxyCounter++;
                        }
                        ob.tag = tag;
                        usedTags.add(tag);
                        outbounds.push(ob);
                        log(`Добавлен сервер: ${tag}`, 'ok');
                    } else {
                        log(`Не удалось распарсить: ${entry.data?.substring(0, 40)}...`, 'warning');
                    }
                }

                if (outbounds.length === 0) {
                    log(`Группа "${g.name}" пропущена (нет серверов)`, 'warning');
                    continue;
                }

                outbounds.push({ tag: 'direct', protocol: 'freedom' });
                outbounds.push({ tag: 'block', protocol: 'blackhole' });

                result.push({
                    remarks: g.name,
                    dns: { servers: ['1.1.1.1', '1.0.0.1'], queryStrategy: 'UseIP' },
                    routing: {
                        rules: [{ type: 'field', protocol: ['bittorrent'], outboundTag: 'direct' }],
                        domainMatcher: 'hybrid',
                        domainStrategy: 'IPIfNonMatch'
                    },
                    inbounds: [{
                        tag: 'socks',
                        port: 10808,
                        listen: '127.0.0.1',
                        protocol: 'socks',
                        settings: { udp: true, auth: 'noauth' },
                        sniffing: { enabled: true, routeOnly: false, destOverride: ['http', 'tls', 'quic'] }
                    }, {
                        tag: 'http',
                        port: 10809,
                        listen: '127.0.0.1',
                        protocol: 'http',
                        settings: { allowTransparent: false },
                        sniffing: { enabled: true, routeOnly: false, destOverride: ['http', 'tls', 'quic'] }
                    }],
                    outbounds: outbounds
                });
            }

            const json = prettyJson.checked ? JSON.stringify(result, null, 2) : JSON.stringify(result);
            outputArea.value = json;
            convertedData = result;
            outputSize.textContent = json.length;

            const total = result.reduce((acc, g) => acc + (g.outbounds?.filter(o => !['direct', 'block'].includes(o.tag))
                .length || 0), 0);
            statsLabel.textContent = `📊 ${result.length} групп, ${total} серверов`;
            serverCount.textContent = `🌐 ${total} серверов`;
            inputStatus.innerHTML = `<span style="color:#3fb950;">✅ Успешно! ${result.length} групп, ${total} серверов</span>`;
            log(`✅ ГОТОВО! ${result.length} групп, ${total} серверов`, 'success');
        };

        // ======================================================================
        //  ПАРСЕРЫ
        // ======================================================================

        function parseVless(url) {
            url = url.replace('vless://', '');
            let tag = '';
            if (url.includes('#')) {
                const parts = url.split('#');
                url = parts[0];
                tag = decodeURIComponent(parts[1] || '').trim();
            }
            if (!tag) tag = 'proxy';
            if (!url.includes('@')) return null;
            const [uid, rest] = url.split('@', 2);
            let addrPort = rest,
                params = '';
            if (rest.includes('?')) {
                const parts = rest.split('?');
                addrPort = parts[0];
                params = parts[1] || '';
            }
            if (!addrPort.includes(':')) return null;
            const [address, port] = addrPort.split(':', 2);
            const param = {};
            if (params) {
                for (const p of params.split('&')) {
                    if (p.includes('=')) {
                        const [k, v] = p.split('=', 2);
                        param[k] = (k === 'path' || k === 'host') ? decodeURIComponent(v) : v;
                    }
                }
            }
            const network = param.type || 'tcp';
            const security = param.security || 'none';
            const outbound = {
                tag: tag,
                protocol: 'vless',
                settings: {
                    vnext: [{
                        address: address,
                        port: parseInt(port),
                        users: [{ id: uid, encryption: param.encryption || 'none', flow: param.flow || '', level: 0 }]
                    }]
                }
            };
            const stream = { network, security };
            if (network === 'ws') {
                const ws = {};
                if (param.path) ws.path = param.path;
                if (param.host) ws.headers = { Host: param.host };
                else if (param.sni) ws.headers = { Host: param.sni };
                stream.wsSettings = ws;
            }
            if (security === 'tls') {
                const tls = {};
                if (param.sni) tls.serverName = param.sni;
                else if (param.host) tls.serverName = param.host;
                tls.fingerprint = param.fp || 'chrome';
                stream.tlsSettings = tls;
            } else if (security === 'reality') {
                const reality = {};
                if (param.sni) reality.serverName = param.sni;
                if (param.fp) reality.fingerprint = param.fp;
                if (param.pbk) reality.publicKey = param.pbk;
                if (param.sid) reality.shortId = param.sid;
                stream.realitySettings = reality;
            }
            if (network === 'xhttp') {
                const xhttp = {};
                if (param.path) xhttp.path = param.path;
                if (param.mode) xhttp.mode = param.mode;
                if (param.host) xhttp.host = param.host;
                if (param.extra) { try { xhttp.extra = JSON.parse(param.extra); } catch (e) {} }
                stream.xhttpSettings = xhttp;
            } else if (network === 'grpc') {
                const grpc = {};
                if (param.serviceName) grpc.serviceName = param.serviceName;
                if (param.mode === 'gun') grpc.multiMode = true;
                stream.grpcSettings = grpc;
            }
            if (Object.keys(stream).length > 1) outbound.streamSettings = stream;
            return outbound;
        }

        function parseHysteria2(url) {
            url = url.replace('hysteria2://', '');
            let tag = '';
            if (url.includes('#')) {
                const parts = url.split('#');
                url = parts[0];
                tag = decodeURIComponent(parts[1] || '').trim();
            }
            if (!tag) tag = 'proxy';
            if (!url.includes('@')) return null;
            const [auth, rest] = url.split('@', 2);
            let addrPort = rest,
                params = '';
            if (rest.includes('?')) {
                const parts = rest.split('?');
                addrPort = parts[0];
                params = parts[1] || '';
            }
            if (!addrPort.includes(':')) return null;
            const [address, port] = addrPort.split(':', 2);
            const param = {};
            if (params) {
                for (const p of params.split('&')) {
                    if (p.includes('=')) {
                        const [k, v] = p.split('=', 2);
                        param[k] = (k === 'sni') ? decodeURIComponent(v) : v;
                    }
                }
            }
            const outbound = {
                tag: tag,
                protocol: 'hysteria',
                settings: { address, port: parseInt(port), version: 2 },
                streamSettings: {
                    network: 'hysteria',
                    security: 'tls',
                    hysteriaSettings: { version: 2, auth: auth }
                }
            };
            const tls = {};
            if (param.sni) tls.serverName = param.sni;
            if (param.fp) tls.fingerprint = param.fp;
            if (Object.keys(tls).length) outbound.streamSettings.tlsSettings = tls;
            return outbound;
        }

        function parseTrojan(url) {
            url = url.replace('trojan://', '');
            let tag = '';
            if (url.includes('#')) {
                const parts = url.split('#');
                url = parts[0];
                tag = decodeURIComponent(parts[1] || '').trim();
            }
            if (!tag) tag = 'proxy';
            if (!url.includes('@')) return null;
            const [password, rest] = url.split('@', 2);
            let addrPort = rest,
                params = '';
            if (rest.includes('?')) {
                const parts = rest.split('?');
                addrPort = parts[0];
                params = parts[1] || '';
            }
            if (!addrPort.includes(':')) return null;
            const [address, port] = addrPort.split(':', 2);
            const param = {};
            if (params) {
                for (const p of params.split('&')) {
                    if (p.includes('=')) {
                        const [k, v] = p.split('=', 2);
                        param[k] = (k === 'path' || k === 'host') ? decodeURIComponent(v) : v;
                    }
                }
            }
            const network = param.type || 'tcp';
            const security = param.security || 'tls';
            const outbound = {
                tag: tag,
                protocol: 'trojan',
                settings: { servers: [{ address, port: parseInt(port), password }] }
            };
            const stream = { network, security };
            if (security === 'tls') {
                const tls = {};
                if (param.sni) tls.serverName = param.sni;
                else if (param.host) tls.serverName = param.host;
                if (param.fp) tls.fingerprint = param.fp;
                stream.tlsSettings = tls;
            }
            if (network === 'ws') {
                const ws = {};
                if (param.path) ws.path = param.path;
                if (param.host) ws.headers = { Host: param.host };
                stream.wsSettings = ws;
            }
            if (Object.keys(stream).length > 1) outbound.streamSettings = stream;
            return outbound;
        }

        function parseVmess(url) {
            url = url.replace('vmess://', '');
            try {
                const decoded = atob(url);
                const config = JSON.parse(decoded);
                let uid = config.id || '';
                if (uid.length > 36) uid = uid.slice(0, 36);
                let tag = config.ps || 'proxy';
                try { tag = decodeURIComponent(tag); } catch (e) {}
                const outbound = {
                    tag: tag,
                    protocol: 'vmess',
                    settings: {
                        vnext: [{
                            address: config.add || '',
                            port: parseInt(config.port || 0),
                            users: [{ id: uid, alterId: parseInt(config.aid || 0), security: config.scy || 'auto' }]
                        }]
                    },
                    streamSettings: { network: config.net || 'tcp', security: config.tls || 'none' }
                };
                if ((config.net || '') === 'ws') {
                    const ws = {};
                    if (config.path) ws.path = config.path;
                    if (config.host) ws.headers = { Host: config.host };
                    outbound.streamSettings.wsSettings = ws;
                }
                if ((config.tls || '') === 'tls') {
                    const tls = {};
                    if (config.sni) tls.serverName = config.sni;
                    if (config.fp) tls.fingerprint = config.fp;
                    outbound.streamSettings.tlsSettings = tls;
                }
                return outbound;
            } catch (e) { return null; }
        }

        function parseShadowsocks(url) {
            url = url.replace('ss://', '');
            let tag = '';
            if (url.includes('#')) {
                const parts = url.split('#');
                url = parts[0];
                tag = decodeURIComponent(parts[1] || '').trim();
            }
            if (!tag) tag = 'proxy';
            if (url.includes('@')) {
                const [methodPassword, rest] = url.split('@', 2);
                let method = 'aes-256-gcm',
                    password = methodPassword;
                if (methodPassword.includes(':')) {
                    const parts = methodPassword.split(':');
                    method = parts[0];
                    password = parts[1] || '';
                }
                let addrPort = rest;
                if (rest.includes('?')) addrPort = rest.split('?')[0];
                if (!addrPort.includes(':')) return null;
                const [address, port] = addrPort.split(':', 2);
                return {
                    tag: tag,
                    protocol: 'shadowsocks',
                    settings: { servers: [{ address, port: parseInt(port), method, password }] }
                };
            }
            return null;
        }
